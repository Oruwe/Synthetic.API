name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked: fail the build if uv.lock is out of sync with
        # pyproject.toml, instead of silently re-resolving and letting a
        # stale/mismatched lockfile pass CI unnoticed.
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy agents/

      - name: Run tests with coverage
        # --cov-fail-under=80: a real gate, not just a reported number --
        # verified against this repo's actual current coverage (86%
        # overall, including the fully-untested dormant/retired pipelines
        # -- see README's "What's dormant" -- which pull the number down;
        # 80 leaves real headroom without being loose enough to be
        # meaningless).
        run: uv run pytest -q --cov=agents --cov-report=term-missing --cov-fail-under=80
