name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked: fail the build if uv.lock is out of sync with
        # pyproject.toml, instead of silently re-resolving and letting a
        # stale/mismatched lockfile pass CI unnoticed.
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
