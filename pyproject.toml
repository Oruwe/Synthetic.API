[project]
name = "synthetic-api"
version = "0.1.0"
description = "API-Less Bridge: a multi-agent swarm that acts as a synthetic API for legacy web portals"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.11",
    "fastembed>=0.3.6",
    "playwright>=1.47",
    "structlog>=24.4",
    "langfuse>=2.50",
    "networkx>=3.3",
    "httpx>=0.27",
    "python-dotenv>=1.0.1",
    "anthropic>=0.40",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
