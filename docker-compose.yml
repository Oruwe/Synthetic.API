services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    # Bound to the VM's own loopback only, not its public interface --
    # agents-orchestrator/agents-synthesizer still reach this fine via
    # the internal docker network (http://qdrant:6333), unaffected by
    # this binding. The dashboard (localhost:6333/dashboard) stays
    # reachable exactly as in local dev via an SSH tunnel
    # (`ssh -L 6333:localhost:6333 <vm>`) -- see README's deployment
    # section. Nothing here should ever be reachable from the open
    # internet: it's the vector store, not the product.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock_portal:
    # context: . (repo root), not ./mock_portal -- mock_portal/Dockerfile
    # needs the root pyproject.toml/uv.lock to install its own dependency
    # group (see that Dockerfile's own comment).
    build:
      context: .
      dockerfile: mock_portal/Dockerfile
    restart: unless-stopped
    # Internal fixture only, reached by the agent containers via
    # http://mock_portal:5000 on the docker network -- loopback-only on
    # the host so it's never reachable from the public internet either.
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORTAL_USERNAME: ${PORTAL_USERNAME:-admin}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Ambient RPA demo/test target (feature/ambient-rpa-action-bridge
  # only) ---------------------------------------------------------------
  # A safe, self-controlled, reversible site for action_executor.py to
  # act on -- both for the hackathon demo itself and for validating the
  # real vision model's decisions (see demo_target/app.py's docstring and
  # scripts/live_test_action_loop.py). Never a real third-party site:
  # this is the "safe/reversible default demo target" safety rail named
  # in README's Ambient RPA section, applied to testing too, not just
  # the live demo.
  demo_target:
    # context: . -- see mock_portal's identical build: comment above.
    build:
      context: .
      dockerfile: demo_target/Dockerfile
    restart: unless-stopped
    # Same reasoning as mock_portal above: reached internally via
    # http://demo_target:5050, loopback-only on the host. Not something
    # a deployment's actual visitors need to reach directly -- they see
    # its effects through the product (the UI/API), not the fixture
    # itself.
    ports:
      - "127.0.0.1:5050:5050"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5050/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Ambient RPA memory (feature/ambient-rpa-action-bridge only) --------
  # Cross-process lock backend for qdrant_store.record_workflow_outcome's
  # read-merge-write -- see that function and _distributed_lock_for_workflow
  # for the full design. Deliberately never health-blocking on the agent
  # services below (same posture as langfuse): this is a hardening layer
  # for a scaled-out orchestrator, not a hard dependency for a single one,
  # and qdrant_store falls back to an in-process lock (same-process safety
  # only, logged) if this is unreachable at call time.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:` at all -- never exposed to the host, only reachable via
    # the internal docker network (redis://redis:6379), which is all any
    # container here ever needs.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Observability (Langfuse) -------------------------------------------
  # Single-Postgres Langfuse v2 image, deliberately NOT v3 (which needs
  # ClickHouse + Redis + S3 on top) -- too much infra for a 3-day solo build.
  # Both agent services list this as a compose dependency but never
  # health-block on it: tracing must degrade gracefully if it's slow to
  # start or down (see agents/common/langfuse_tracer.py).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports:` -- Langfuse reaches this over the internal docker
    # network only; there is no reason for Postgres itself to ever be
    # reachable from the host, let alone the public internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback-only: Langfuse is an observability dashboard for whoever
    # operates this deployment, not part of the product a visitor uses.
    # Reach it via an SSH tunnel (`ssh -L 3000:localhost:3000 <vm>`, then
    # open http://localhost:3000) -- which is also why NEXTAUTH_URL below
    # stays "http://localhost:3000" even on a real deployment: that's the
    # URL your own browser actually requests it at, through the tunnel.
    # Expose this publicly instead only if you deliberately want Langfuse's
    # own login screen to be the access control (change this binding AND
    # NEXTAUTH_URL together).
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD:-langfuse}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-only-nextauth-secret-change-me}
      SALT: ${LANGFUSE_SALT:-dev-only-salt-change-me}
      TELEMETRY_ENABLED: "false"

  # --- Agents --------------------------------------------------------------
  agents-orchestrator:
    build:
      context: .
      dockerfile: agents/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "agents.orchestrator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Public: this is the actual product's API. Its own routes require
    # X-API-Key when ORCHESTRATOR_API_KEY is set (see agents/orchestrator/
    # auth.py) -- MUST be set in .env before this is reachable from the
    # open internet; see README's deployment section.
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      # mock_portal is only used by the dormant shipping-portal pipeline's
      # own offline tests now (see planner.py) -- not health-blocking so
      # the live search/fetch path can start without it being ready.
      mock_portal:
        condition: service_started
      langfuse:
        condition: service_started  # never health-blocking; tracing fails open
      redis:
        condition: service_started  # never health-blocking; falls back to an in-process lock
    env_file:
      - .env
    environment:
      PORTAL_BASE_URL: http://mock_portal:5000
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
      REDIS_URL: redis://redis:6379/0
      RUN_STORE_DIR: /data/runs
      SCREENSHOT_DIR: /data/screenshots
    volumes:
      - ./data/runs:/data/runs
      - ./data/screenshots:/data/screenshots
    healthcheck:
      # /ready (not /health): readiness, not liveness -- fails while Qdrant
      # is unreachable, matching this service's actual ability to do its job.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  agents-synthesizer:
    build:
      context: .
      dockerfile: agents/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "agents.synthesizer.main"]
    depends_on:
      qdrant:
        condition: service_healthy
      langfuse:
        condition: service_started  # never health-blocking; tracing fails open
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
      RUN_STORE_DIR: /data/runs
    volumes:
      - ./data/runs:/data/runs
    healthcheck:
      # This service is a bare polling loop, not an HTTP server -- checks
      # the heartbeat file watcher.py writes every poll iteration is
      # recent, rather than a request/response check. See watcher.py.
      test: ["CMD-SHELL", "python -c \"import json,time; d=json.load(open('/data/runs/_synthesizer_heartbeat.json')); assert time.time() - d['last_poll_at'] < 30\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # --- Demo UI (optional, purely additive) --------------------------------
  # Talks ONLY to the Orchestrator's existing HTTP API (/trigger,
  # /runs/{id}) over the network -- no direct Qdrant/run_store access --
  # so it carries zero risk to the pipeline itself. Exists because
  # curl/bash scripts aren't a great surface for a judge or a live demo.
  # See ui/app.py for why voice input/output are handled the way they are.
  demo-ui:
    # context: . -- see mock_portal's identical build: comment above.
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    # Public: this is the actual product's UI.
    ports:
      - "7860:7860"
    environment:
      ORCHESTRATOR_URL: http://agents-orchestrator:8000
      # Must match ORCHESTRATOR_API_KEY below/in .env -- empty on both
      # sides is fine (local dev, unauthenticated); set on one side only
      # and every UI request gets a 401.
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
    depends_on:
      agents-orchestrator:
        condition: service_started

volumes:
  qdrant_storage:
  postgres_data:
